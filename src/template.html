<!DOCTYPE html>
<html lang="{{%%lang%%}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
   
    <title>{{%%title%%}}</title>
    <meta name="Description" content="{{%%description%%}}">
    <meta property="article:published_time" content="{{%%created%%}}">
    <meta property="article:modified_time" content="{{%%lastmod%%}}">

    {{%%metatags%%}}
   
    <meta property="og:site_name" content="Laywake">
    <meta property="og:image" content="{{%%cover%%}}">
</head>

<body>
    <object data="components/navbar.html"></object>
 

    <img src="{{%%cover%%}}">
    <h2 id="blogtitle" class="text-2xl">{{%%title%%}}</h2>

    <div id="bloginfo">
        <p>Written on {{%%created%%}}</p>  
        <div>Tags: 
            <ul>
                {{%%tags%%}}
            </ul>
        </div>
        <p></p>   
    </div>

    <div id="content">
        Loreum ipsum dolar sit amet, blah blah
    </div>
        
</body>

    <lw-footer></lw-footer>
</html>
